agent:
  autoContinueLimit: 1000 # max silent "Continue" nudges when a turn ends on reasoning or a tool message
  bundledSkills: true     # false = only 'reflection' loaded from .skills/
  bundledSkillOverrides: [] # only honored when bundledSkills is false; additive list of bundled skills to keep
  decision:
    baseUrl: ""           # empty = tool not registered
    model: tev1:4b
  recursionLimit: 1000
  sampling: true          # false = tool not registered
  silent: false           # true = orchestrator stays silent except for final response
api:
  downloadsDir: downloads/
  maxBodySize: 10485760
browser:
  allowlist: []
  maxContentChars: 200000
  maxSessions: 5
  networkIdleMs: 500
  sessionIdleTimeoutMs: 300000
  timeoutMs: 30000
calendar:
  active: google
  google:
    apiKey: ""
    impersonateEmail: ""
    rateLimit:
      requestsPerMinute: 60
    serviceAccountEmail: ""
    serviceAccountKey: ""
  msgraph:
    clientId: ""
    clientSecret: ""
    rateLimit:
      requestsPerMinute: 60
    tenantId: ""
confluence:
  baseUrl: ""   # e.g. https://example.atlassian.net (CONFLUENCE_BASE_URL)
  enabled: false # false = tool not registered (CONFLUENCE_ENABLED)
  api: cloud    # cloud (REST v2 /wiki/api/v2) or dc (Data Center REST v1 /rest/api) (CONFLUENCE_API)
  rateLimit: 10
  timeout: 30000
  token: ""     # personal access token, sent as Bearer (CONFLUENCE_TOKEN)
cwd: ""
email:
  provider:
    type: gmail
    userId: me
image:
  evictionBudgetChars: 2000000
  maxDimension: 3000
  maxWidth: 1920
jira:
  assignee: ""  # default assignee username (JIRA_ASSIGNEE)
  baseUrl: ""   # e.g. https://jira.example.com (JIRA_BASE_URL)
  enabled: false # false = tool not registered (JIRA_ENABLED)
  project: ""   # default project key (JIRA_PROJECT)
  rateLimit: 10
  timeout: 30000
  token: ""     # personal access token, sent as Bearer (JIRA_TOKEN)
loopDetection:
  enabled: true
  escalationCount: 3
  escalationWindowMs: 60000
  maxChain: 8
  maxRun: 50
  maxStreams: 4
  maxThreads: 4
  minChain: 3
  subagent: true
  threshold: 10
  ttlMs: 60000
  wordWindowSize: 2090
memory:
  checkpointsDir: memory/checkpoints/
  contextDir: memory/context/
  directory: memory/
  ephemeralLimit: 5
  gc:
    enabled: true
    idleTimeoutMs: 300000
    maxGcPerHour: 4
  maxEntries: 100
  maxTodos: 100
  schedulesDir: memory/schedules/
  screenshotsDir: memory/screenshots/
  sessionsDir: memory/sessions/
  toolsDir: memory/tools/
nosql:
  mongodb:
    connectionString: "" # MONGODB_CONNECTION_STRING
    host: ""             # MONGODB_HOST
    port: 27017          # MONGODB_PORT
    credentials:
      username: ""       # MONGODB_USERNAME
      password: ""       # MONGODB_PASSWORD
      database: ""       # MONGODB_DATABASE
  redis:
    host: ""             # REDIS_HOST
    port: 6379           # REDIS_PORT
    credentials:
      username: ""       # REDIS_USERNAME
      password: ""       # REDIS_PASSWORD
    db: 0                # REDIS_DB
persistence:
  mode: sqlite
poppy:
  clientId: ""     # agent's client_id URL (POPPY_CLIENT_ID)
  clientName: ""   # agent's display name (POPPY_CLIENT_NAME)
  jwksUri: ""      # public JWKS URL (POPPY_JWKS_URI)
  redirectUris: [] # valid redirect URIs (POPPY_REDIRECT_URIS_0, _1, ...)
  logoUri: ""      # optional logo URL (POPPY_LOGO_URI)
providers:
  azure:
    apiVersion:
    contextWindow: 128000
    enabled: false
    endpoint:
    maxTokens: -1
    model: gpt-4o
    rateLimit:
      maxConcurrency: 4
      maxRetries: 6
      maxTokensMinute: 0
    reasoning:
      effort: medium
    temperature: 0.4
    type: azure-openai
  copilot:
    base_url: https://api.githubcopilot.com
    contextWindow: 128000
    enabled: false
    enterpriseUrl:
    maxTokens: -1
    model: gpt-4o
    rateLimit:
      maxConcurrency: 4
      maxRetries: 6
      maxTokensMinute: 0
    reasoning:
      effort: medium
    temperature: 0.4
    type: github-copilot
  fal:
    credentials:
      apiKey: ""
    enabled: false
    model: fal-ai/flux
    type: fal
  openai:
    base_url: https://api.openai.com/v1
    contextWindow: 128000
    credentials:
      apiKey:
    enabled: true
    maxTokens: -1
    model: gpt-4o
    rateLimit:
      maxConcurrency: 4
      maxRetries: 6
      maxTokensMinute: 0
    reasoning:
      effort: medium
    temperature: 0.4
    type: openai
sandbox:
  audio:
    maxFileSize: 26214400
  git:
    maxBuffer: 67108864
  maxDiffBuffer: 16777216
  maxPaginatedReadSize: 52428800
  # Size limits, all in bytes
  maxReadSize: 1048576
  maxWriteSize: 512000
  paths:
    - "/tmp"
  pdf:
    maxFileSize: 52428800
  permissions:
    - filesystem:read
    - filesystem:write
    - filesystem:exec
    - process:spawn
    - network:outbound
    - env:read
  skillScanPaths:
    - "skills/"
    - ".skills/"
sql:
  postgres:
    host: ""             # POSTGRES_HOST
    port: 5432           # POSTGRES_PORT
    user: ""             # POSTGRES_USER
    password: ""         # POSTGRES_PASSWORD
    database: ""         # POSTGRES_DATABASE
  sqlite:
    file: ""             # SQLITE_FILE
  mysql:
    host: ""             # MYSQL_HOST
    port: 3306           # MYSQL_PORT
    user: ""             # MYSQL_USER
    password: ""         # MYSQL_PASSWORD
    database: ""         # MYSQL_DATABASE
schedules:
  logPath: ""
  syncOnInit: true
search:
  bing:
    apiKey: ""
  brave:
    apiKey: ""
  custom:
    apiKey: ""
    body: ""
    descriptionField: ""
    headers: ""
    method: ""
    queryKey: ""
    titleField: ""
    url: ""
    urlField: ""
  duckduckgo:
    baseUrl: "https://html.duckduckgo.com/html/"
    region: ""
    safeSearch: "0"
    time: ""
  exa:
    apiKey: ""
  firecrawl:
    apiKey: ""
  searxng:
    url: ""
  tavily:
    apiKey: ""
skillAgentMap:
  - pattern: "^openspec-"
    agent: coding
  - pattern: "^audit-"
    agent: security-audit
subAgentsReasoning:
  "code-review": high
  coding: medium
  debug: high
  documentation: low
  performance: medium
  research: medium
  search: low
  "security-audit": high
  seoAnalyst: low
  testing: medium
  textEditor: low
  translator: low
subAgentsTemperature:
  "code-review": 0.1
  coding: 0.3
  debug: 0.2
  documentation: 0.3
  performance: 0.2
  research: 0.5
  search: 0.5
  "security-audit": 0.1
  seoAnalyst: 0.3
  testing: 0.2
  textEditor: 0.4
  translator: 0.3
summarization:
  keepMessages: 10
  contextFraction: 0.8
telemetry:
  enabled: false
  exporter:
    endpoint: http://localhost:4318
    protocol: console
    timeoutMs: 10000
  sampling:
    ratio: 0.1
tui:
  mouseScrollLines: 3
  name: Madz
  overscan: 10
  reasoningCollapsed: true
  showToolResults: true
  statusBar:
    context: true
    contextPercent: false
    messages: true
    model: true
    project: true
    quote: true
    skills: true
    tokens: true
    version: true
  toolCallCollapsed: true
vector:
  ftsTokenize: "porter unicode61"
  fulltext: true
  maxFileSize: 524288
  model: local
  projects: {}
  searchMode: hybrid
