providers:
  openai:
    type: openai
    base_url: https://api.openai.com/v1
    model: gpt-4o
    encoding: cl100k_base
    credentials:
      apiKey:
    temperature: 0.4
    maxTokens: 4096
    rateLimit:
      requestsPerMinute: 120
      maxRetries: 6
      maxConcurrency: 4
email:
  provider:
    type: gmail
    userId: me
  defaultFolder: INBOX
  maxAttachments: 10
  maxAttachmentSize: 25mb
search:
  exa:
    apiKey: ""
  firecrawl:
    apiKey: ""
  tavily:
    apiKey: ""
  parallel:
    apiKey: ""
  searxng:
    url: ""
  bing:
    apiKey: ""
  custom:
    url: ""
    method: ""
    body: ""
    headers: ""
    queryKey: ""
    titleField: ""
    urlField: ""
    descriptionField: ""
    apiKey: ""
calendar:
  google:
    type: google
    apiKey: ""
    serviceAccountKey: ""
    serviceAccountEmail: ""
    impersonateEmail: ""
    rateLimit:
      requestsPerMinute: 60
  msgraph:
    type: msgraph
    tenantId: ""
    clientId: ""
    clientSecret: ""
    delegatedUser: ""
    rateLimit:
      requestsPerMinute: 60
sandbox:
  paths:
    - "./"
    - "/tmp"
  skillScanPaths:
    - "skills/"
    - ".skills/"
  timeout:
    seconds: 600
    gracePeriod: 5
  memoryLimit: 128mb
  safety:
    urlFilter: true
    pythonImportHook: true
  env:
    allowlist:
      - PATH
      - HOME
      - NODE_ENV
      - OPENAI_API_KEY
      - AUTH_API_KEY
      - EMAIL_IMAP_HOST
      - EMAIL_IMAP_PORT
      - EMAIL_IMAP_SECURE
      - EMAIL_IMAP_USER
      - EMAIL_IMAP_PASSWORD
      - EMAIL_SMTP_HOST
      - EMAIL_SMTP_PORT
      - EMAIL_DEFAULT_FOLDER
      - EMAIL_MAX_ATTACHMENTS
      - EMAIL_MAX_ATTACHMENT_SIZE
  permissions:
    - filesystem:read
    - filesystem:write
    - filesystem:exec
    - process:spawn
    - network:outbound
  maxReadSize: 10mb
  trustProjectSkills: true
persistence:
  mode: sqlite
  sqlite_path: memory/checkpoints/checkpoints.db

memory:
  directory: memory/
  contextDir: memory/context/
  subAgentsDir: memory/sub-agents/
  errorsDir: memory/errors/
  schedulesDir: memory/schedules/
  sessionsDir: memory/sessions/
  checkpointsDir: memory/checkpoints/
  ephemeralLimit: 5
  ephemeral:
    ttlDays: 7
    maxEntries: 10
  gc:
    enabled: true
    idleTimeoutMs: 300000
    maxGcPerHour: 4
tui:
  name: madz
  renderWindow: 100
agent:
  recursionLimit: 1000
  autoContinueLimit: 1000
  nodeTimeout: 600000
  deepAgents:
    codingAgent:
      description: "Specialized agent for code-related tasks including file editing, debugging, and implementation."
      temperature: 0.3
skillAgentMap:
  - pattern: "^openspec-"
    agent: coding
  - pattern: "^audit-"
    agent: security-audit
subAgentsTemperature:
  coding: 0.3
  search: 0.5
  debug: 0.2
  "code-review": 0.1
  research: 0.5
  testing: 0.2
  documentation: 0.3
  "security-audit": 0.1
  performance: 0.2
  textEditor: 0.4
  seoAnalyst: 0.3
  translator: 0.3
cwd: ""
