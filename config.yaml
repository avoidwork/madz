agent:
  autoContinueLimit: 1000 # max silent "Continue" nudges when a turn ends on reasoning
  bundledSkills: true     # false = only 'reflection' loaded from .skills/
  decision:
    baseUrl: ""           # empty = tool not registered
    model: tev1:4b
  recursionLimit: 1000
  sampling: true          # false = tool not registered
  silent: false           # true = orchestrator stays silent except for final response
api:
  downloadsDir: downloads/
  maxBodySize: 10485760
browser:
  allowlist: []
  maxContentChars: 200000
  maxSessions: 5
  networkIdleMs: 500
  sessionIdleTimeoutMs: 300000
  timeoutMs: 30000
calendar:
  active: google
  google:
    apiKey: ""
    impersonateEmail: ""
    rateLimit:
      requestsPerMinute: 60
    serviceAccountEmail: ""
    serviceAccountKey: ""
  msgraph:
    clientId: ""
    clientSecret: ""
    rateLimit:
      requestsPerMinute: 60
    tenantId: ""
confluence:
  baseUrl: ""   # e.g. https://example.atlassian.net (CONFLUENCE_BASE_URL)
  enabled: false # false = tool not registered (CONFLUENCE_ENABLED)
  rateLimit: 10
  timeout: 30000
  token: ""     # personal access token, sent as Bearer (CONFLUENCE_TOKEN)
cwd: ""
email:
  provider:
    type: gmail
    userId: me
image:
  evictionBudgetChars: 2000000
  maxDimension: 3000
  maxWidth: 1920
jira:
  assignee: ""  # default assignee username (JIRA_ASSIGNEE)
  baseUrl: ""   # e.g. https://jira.example.com (JIRA_BASE_URL)
  enabled: false # false = tool not registered (JIRA_ENABLED)
  project: ""   # default project key (JIRA_PROJECT)
  rateLimit: 10
  timeout: 30000
  token: ""     # personal access token, sent as Bearer (JIRA_TOKEN)
loopDetection:
  enabled: true
  escalationCount: 3
  escalationWindowMs: 60000
  threshold: 2
  ttlMs: 60000
  windowSize: 20
memory:
  checkpointsDir: memory/checkpoints/
  contextDir: memory/context/
  directory: memory/
  ephemeralLimit: 5
  gc:
    enabled: true
    idleTimeoutMs: 300000
    maxGcPerHour: 4
  maxEntries: 100
  maxTodos: 100
  schedulesDir: memory/schedules/
  screenshotsDir: memory/screenshots/
  sessionsDir: memory/sessions/
  toolsDir: memory/tools/
persistence:
  mode: sqlite
providers:
  azure:
    apiVersion:
    contextWindow: 128000
    enabled: false
    endpoint:
    maxTokens: -1
    model: gpt-4o
    rateLimit:
      maxConcurrency: 4
      maxRetries: 6
      maxTokensMinute: 0
    reasoning:
      effort: medium
    temperature: 0.4
    type: azure-openai
  copilot:
    base_url: https://api.githubcopilot.com
    contextWindow: 128000
    enabled: false
    enterpriseUrl:
    maxTokens: -1
    model: gpt-4o
    rateLimit:
      maxConcurrency: 4
      maxRetries: 6
      maxTokensMinute: 0
    reasoning:
      effort: medium
    temperature: 0.4
    type: github-copilot
  fal:
    credentials:
      apiKey: ""
    enabled: false
    model: fal-ai/flux
    type: fal
  openai:
    base_url: https://api.openai.com/v1
    contextWindow: 128000
    credentials:
      apiKey:
    enabled: true
    maxTokens: -1
    model: gpt-4o
    rateLimit:
      maxConcurrency: 4
      maxRetries: 6
      maxTokensMinute: 0
    reasoning:
      effort: medium
    temperature: 0.4
    type: openai
sandbox:
  audio:
    maxFileSize: 26214400
  git:
    maxBuffer: 67108864
  maxDiffBuffer: 16777216
  maxPaginatedReadSize: 52428800
  # Size limits, all in bytes
  maxReadSize: 1048576
  maxWriteSize: 512000
  paths:
    - "/tmp"
  pdf:
    maxFileSize: 52428800
  permissions:
    - filesystem:read
    - filesystem:write
    - filesystem:exec
    - process:spawn
    - network:outbound
    - env:read
  skillScanPaths:
    - "skills/"
    - ".skills/"
schedules:
  logPath: ""
  syncOnInit: true
search:
  bing:
    apiKey: ""
  brave:
    apiKey: ""
  custom:
    apiKey: ""
    body: ""
    descriptionField: ""
    headers: ""
    method: ""
    queryKey: ""
    titleField: ""
    url: ""
    urlField: ""
  duckduckgo:
    baseUrl: "https://html.duckduckgo.com/html/"
    region: ""
    safeSearch: "0"
    time: ""
  exa:
    apiKey: ""
  firecrawl:
    apiKey: ""
  searxng:
    url: ""
  tavily:
    apiKey: ""
skillAgentMap:
  - pattern: "^openspec-"
    agent: coding
  - pattern: "^audit-"
    agent: security-audit
subAgentsReasoning:
  "code-review": high
  coding: medium
  debug: high
  documentation: low
  performance: medium
  research: medium
  search: low
  "security-audit": high
  seoAnalyst: low
  testing: medium
  textEditor: low
  translator: low
subAgentsTemperature:
  "code-review": 0.1
  coding: 0.3
  debug: 0.2
  documentation: 0.3
  performance: 0.2
  research: 0.5
  search: 0.5
  "security-audit": 0.1
  seoAnalyst: 0.3
  testing: 0.2
  textEditor: 0.4
  translator: 0.3
summarization:
  enabled: true
  keepMessages: 5
  trigger:
    type: tokens
    value: 100000
telemetry:
  enabled: false
  exporter:
    endpoint: http://localhost:4318
    protocol: console
    timeoutMs: 10000
  sampling:
    ratio: 0.1
tui:
  mouseScrollLines: 3
  name: Madz
  overscan: 10
  reasoningCollapsed: true
  showToolResults: true
  statusBar:
    context: true
    messages: true
    model: true
    project: true
    quote: true
    skills: true
    tokens: true
    version: true
  toolCallCollapsed: true
vector:
  ftsTokenize: "porter unicode61"
  fulltext: true
  maxFileSize: 524288
  model: local
  projects: {}
  searchMode: hybrid
