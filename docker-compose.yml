services:
  madz:
    build:
      context: .
      dockerfile: Dockerfile
    image: madz:latest
    environment:
      - NODE_ENV=development
      - TZ=America/Toronto
    ports:
      - "2222:22"
      - "3000:3000"
    volumes:
      - ./memory:/app/memory
      - ./skills:/app/skills
    tty: true
    stdin_open: true
